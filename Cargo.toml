[package]
name = "ibniz"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A Rust implementation of the IBNIZ audiovisual virtual machine"
license = "Zlib"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:cpal"]

[dependencies]
eframe = { version = "0.33", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
cpal = { version = "0.16", optional = true }

[profile.release]
lto = "thin"
