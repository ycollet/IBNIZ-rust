name: Release installers

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s packaging -p 'test_*.py'
      - id: version
        run: python packaging/package.py metadata --tag "$RELEASE_TAG"

  linux:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            container: rust:1-bookworm
          - format: rpm
            container: fedora:43
    container:
      image: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    env:
      PACKAGE_FORMAT: ${{ matrix.format }}
    steps:
      - name: Install Debian build dependencies
        if: matrix.format == 'deb'
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            python3 git pkg-config dpkg-dev libasound2-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Install Fedora build dependencies
        if: matrix.format == 'rpm'
        run: |
          dnf install -y curl ca-certificates gcc-c++ git python3 pkgconf-pkg-config rpm-build \
            alsa-lib-devel libX11-devel libXi-devel libXcursor-devel \
            libXrandr-devel libXinerama-devel mesa-libGL-devel wayland-devel \
            libxkbcommon-devel libxkbcommon-x11-devel
      - name: Install Rust stable on Fedora
        if: matrix.format == 'rpm'
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and check desktop binary
        run: |
          cargo test --locked --release --bin ibniz
          cargo build --locked --release
      - name: Package and install
        run: |
          python3 packaging/package.py build --tag "$RELEASE_TAG" \
            --format "$PACKAGE_FORMAT" --binary target/release/ibniz
          if [ "$PACKAGE_FORMAT" = deb ]; then
            apt-get install -y ./target/installers/*.deb
          else
            dnf install -y ./target/installers/*.rpm
          fi
          /usr/bin/ibniz --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.format }}-x86_64
          path: target/installers/*.${{ matrix.format }}
          if-no-files-found: error
          compression-level: 0

  macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
          - runner: macos-14
            target: aarch64-apple-darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      RUST_TARGET: ${{ matrix.target }}
      PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Select Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$RUST_TARGET"
      - name: Build and check desktop binary
        run: |
          cargo test --locked --release --target "$RUST_TARGET" --bin ibniz
          cargo build --locked --release --target "$RUST_TARGET"
          "target/$RUST_TARGET/release/ibniz" --version
      - name: Build application bundle and disk image
        run: |
          python packaging/package.py build --tag "$RELEASE_TAG" --format dmg \
            --arch "$PACKAGE_ARCH" --binary "target/$RUST_TARGET/release/ibniz"
      - name: Check disk image contents
        run: |
          mountpoint="$RUNNER_TEMP/ibniz-dmg"
          mkdir "$mountpoint"
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" target/installers/*.dmg
          trap 'hdiutil detach "$mountpoint"' EXIT
          codesign --verify --strict "$mountpoint/IBNIZ Rust.app"
          "$mountpoint/IBNIZ Rust.app/Contents/MacOS/ibniz" --version
          test -L "$mountpoint/Applications"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-macos-${{ matrix.arch }}
          path: target/installers/*.dmg
          if-no-files-found: error
          compression-level: 0

  windows:
    needs: validate
    runs-on: windows-2022
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - name: Select Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "Rust installation failed" }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw "Rust toolchain selection failed" }
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Rust target installation failed" }
      - name: Install WiX
        # WiX 5 predates the additional maintenance-fee EULA in newer versions.
        run: |
          dotnet tool install --tool-path .tools wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "WiX installation failed" }
          "$env:GITHUB_WORKSPACE\.tools" >> $env:GITHUB_PATH
          .\.tools\wix.exe extension add --global WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw "WiX UI extension installation failed" }
      - name: Build and check desktop binary
        run: |
          cargo test --locked --release --target x86_64-pc-windows-msvc --bin ibniz
          if ($LASTEXITCODE -ne 0) { throw "Desktop tests failed" }
          cargo build --locked --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Release build failed" }
      - name: Build MSI
        run: |
          python packaging/package.py build --tag "$env:RELEASE_TAG" --format msi `
            --binary target/x86_64-pc-windows-msvc/release/ibniz.exe
      - name: Check MSI installation and removal
        run: |
          $msi = (Get-ChildItem target/installers/*.msi).FullName
          $log = Join-Path $env:RUNNER_TEMP "ibniz-install.log"
          $process = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            Get-Content $log -Tail 80
            throw "MSI installation failed: $($process.ExitCode)"
          }
          & "$env:ProgramFiles\IBNIZ Rust\ibniz.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Installed executable failed" }
          $process = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart" -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "MSI uninstall failed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-windows-x86_64
          path: target/installers/*.msi
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [validate, linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.validate.outputs.version }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: target/installers
      - name: Publish installers and checksums
        run: |
          python3 packaging/package.py checksums target/installers
          if ! gh release view "$RELEASE_TAG" --json tagName; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
              --title "IBNIZ Rust $VERSION" --prerelease="$PRERELEASE"
          fi
          gh release upload "$RELEASE_TAG" target/installers/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
